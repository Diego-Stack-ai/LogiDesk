name: Migrate July Company Planning

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Copy and verify the 25 July planning sheets"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install firebase-admin
      - name: Run gated planning migration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          if [ "${{ inputs.execute }}" = "true" ]; then
            python WebApp/tools/migrate_july_company_planning.py --execute
          else
            python WebApp/tools/migrate_july_company_planning.py
          fi
