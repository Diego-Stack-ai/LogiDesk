<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LogiDesk - Rientri DDT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <style>
        .placeholder-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            text-align: center;
            color: var(--text-secondary);
        }
        .placeholder-container .material-icons-round {
            font-size: 64px;
            color: var(--primary-color);
            opacity: 0.5;
            margin-bottom: 16px;
        }
        .placeholder-container h2 {
            font-size: 24px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <header class="app-header">
        <button class="icon-btn" onclick="window.navigateWithState('dashboard.html')">
            <span class="material-icons-round">arrow_back</span>
        </button>
        <div class="header-title">
            <h1>Rientri DDT</h1>
        </div>
        <div style="width: 40px;"></div> <!-- Bilanciamento layout -->
    </header>

    <main class="app-main">
        <div class="placeholder-container">
            <span class="material-icons-round">assignment_return</span>
            <h2>Modulo in fase di migrazione Core V1</h2>
            <p>Questa sezione è temporaneamente disabilitata durante il consolidamento del data model.</p>
        </div>
    </main>

    <script type="module">
        import { auth } from './core/firebase-init.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.replace('login.html');
            }
        });

        window.navigateWithState = function(url) {
            window.location.href = url;
        };
    </script>
</body>
</html>
