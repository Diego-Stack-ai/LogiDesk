<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiDesk - Punti di Consegna</title>
    <link rel="stylesheet" href="styles.css?v=6.460">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <!-- Leaflet per mappa modale -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }
        @media (max-width: 600px) {
            .cards-container {
                grid-template-columns: 1fr;
            }
        }
        .item-card {
            background: white;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 20px;
            transition: all 0.3s ease;
        }
        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -8px rgba(0,0,0,0.1);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .card-title {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-frutta { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
        .badge-latte { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .card-body { margin-top: 16px; }
        .card-row {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
        }
        .data-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .data-label {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
        }
        .data-value {
            font-size: 13px;
            color: #334155;
            font-weight: 500;
        }
        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            justify-content: flex-end;
        }
        .btn-edit, .btn-delete, .btn-geolocate {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            transition: all 0.2s;
        }
        .btn-edit:hover, .btn-geolocate:hover { background: #e2e8f0; }
        .empty-state { text-align: center; color: #64748b; padding: 40px; }
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            background: white;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            box-sizing: border-box;
        }
        .search-box .material-icons-round {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
        .filter-select {
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
        }
        .btn-map, .btn-add {
            padding: 0 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 45px;
        }
        .btn-map { background: #10b981; }
        .btn-map:hover { background: #059669; }
        .btn-add { background: var(--primary); }
        .btn-add:hover { background: var(--primary-hover); }
    </style>
</head>
<body>
        <nav class="glass-nav">
        <div class="nav-content">
            <img src="assets/brand/logidesk-mark.svg" alt="LS" style="height: 32px; width: auto; margin-right: 8px;">
            <button id="dashboardBtn" class="logout-btn" title="Dashboard"
                onclick="window.navigateWithState('dashboard.html')"
                style="border:none; background:none; cursor:pointer; margin-right:8px; display:flex;">
                <span class="material-icons-round">dashboard</span>
            </button>
            <div class="nav-title" style="flex: 1;">Punti di Consegna</div>
            <a href="#" onclick="window.AuthService.logout(); return false;" class="logout-btn" title="Esci"><span class="material-icons-round">logout</span></a>
        </div>
    </nav>
    <main class="main-container">
                <div class="glass-panel" style="padding: 24px; margin-bottom: 24px;">
            <div class="filters-container" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                <div class="input-group" style="flex:1; min-width: 250px;">
                    <input type="text" id="searchInput" placeholder="Cerca cliente, codice o citt ..." style="width:100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px;">
                </div>
                <div class="input-group">
                    <select id="tenantSelectBox" style="min-width: 160px; height: 45px; cursor: pointer; border: 1px solid #e2e8f0; border-radius: 8px; padding: 0 12px; font-weight: 600; color: #0f172a; background: white;">
                        <option value="ALL" style="color: black;">Tutti</option>
                    </select>
                </div>
                <div class="input-group">
                    <select id="typeFilter" style="width: auto; height: 45px; cursor: pointer; border: 1px solid #e2e8f0; border-radius: 8px; padding: 0 12px;">
                        <option value="ALL">Tutti i canali</option>
                        <option value="FRUTTA">Frutta</option>
                        <option value="LATTE">Latte</option>
                    </select>
                </div>
                <div class="input-group">
                    <select id="statusFilter" style="width: auto; height: 45px; cursor: pointer; border: 1px solid #e2e8f0; border-radius: 8px; padding: 0 12px;">
                        <option value="ALL">Tutti gli stati</option>
                        <option value="ATTIVI">Attivi</option>
                        <option value="INATTIVI">Inattivi</option>
                    </select>
                </div>
                <div class="action-buttons" style="display:flex; gap:12px;">
                    <button id="btnShowMap" class="btn-map" onclick="window.navigateWithState('mappa_google.html')" style="background: #10b981; color: white; border: none; height: 45px; padding: 0 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                        <span class="material-icons-round">map</span> Mappa
                    </button>
                    <button class="btn-add" onclick="window.openEditModal(null)" style="background: var(--primary); color: white; border: none; height: 45px; padding: 0 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                        <span class="material-icons-round">add</span> Aggiungi
                    </button>
                </div>
            </div>
        </div>
        <div id="stats" style="margin-bottom: 12px; font-weight: 600; font-size: 13px; color: #64748b; padding-left: 4px;">Caricamento in corso...</div>
        <div id="listContainer" class="list-container cards-container">
            <!-- Items rendered via JS -->
        </div>
    </main>
    <!-- Map Modal -->
    <div class="modal-overlay" id="mapModal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3 style="margin:0; font-size: 16px; color:#1e293b;" id="modalMapTitle">Geolocalizzazione Punto</h3>
                    <div style="font-size: 12px; color:#64748b; margin-top:4px;" id="modalMapSubtitle">Coordinate: N/D</div>
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="btn-icon" style="background:#ef4444; color:white; border:none;" onclick="closeMapModal()">Chiudi</button>
                </div>
            </div>
            <div class="modal-body map-body">
                <div id="mapContainer" style="width: 100%; height: 300px;"></div>
                <div id="leafletMap"></div>
                <div id="noMapOverlay" style="display:none; position:absolute; top:0; left:0; right:0; bottom:0; background:#f8fafc; z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#64748b;">
                    <span class="material-icons-round" style="font-size:48px; margin-bottom:12px; opacity:0.5;">location_off</span>
                    <h3 style="margin:0;">Coordinate non presenti</h3>
                    <p style="font-size:13px;">Impossibile visualizzare il punto sulla mappa.</p>
                </div>
            </div>
        </div>
    </div>
    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content" style="max-width: 600px; height: auto; max-height: 90vh;">
            <div class="modal-header">
                <div>
                    <h3 style="margin:0; font-size: 16px; color:#1e293b;">Modifica Punto di Consegna</h3>
                    <div style="font-size: 12px; color:#64748b; margin-top:4px;" id="editModalSubtitle">ID: ...</div>
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="btn-icon" style="background:#ef4444; color:white; border:none;" onclick="closeEditModal()">Annulla</button>
                    <button class="btn-icon" style="background:#10b981; color:white; border:none;" onclick="saveEdit()">Salva</button>
                </div>
            </div>
            <div class="modal-body">
                <form id="editForm" class="form-grid">
                    <input type="hidden" id="editId">
                    <input type="hidden" id="editTenantId">
                    <div class="form-group">
                        <label>Codice Interno (ID)</label>
                        <input type="text" id="editCodicePunto" readonly style="background:#f1f5f9; color:#64748b; cursor:not-allowed;">
                    </div>
                    <div class="form-group">
                        <label>Codice Esterno (Committente)</label>
                        <input type="text" id="editCodiceEsterno">
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Canale (Sottocodice)</label>
                        <input type="text" id="editSottocodice" readonly style="background:#f1f5f9; color:#64748b; cursor:not-allowed;" title="Modifica non sicura in questa fase">
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Nome Punto</label>
                        <input type="text" id="editNome" required>
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Indirizzo</label>
                        <input type="text" id="editIndirizzo">
                    </div>
                    <div class="form-group">
                        <label>CAP</label>
                        <input type="text" id="editCap">
                    </div>
                    <div class="form-group">
                        <label>Città</label>
                        <input type="text" id="editCitta">
                    </div>
                    <div class="form-group">
                        <label>Provincia</label>
                        <input type="text" id="editProvincia" maxlength="2">
                    </div>
                    <div class="form-group">
                        <label>Zona</label>
                        <input type="text" id="editZona">
                    </div>
                    <div class="form-group">
                        <label>Finestre Consegna</label>
                        <input type="text" id="editFinestre">
                    </div>
                    <div class="form-group">
                        <label>Stato</label>
                        <select id="editStato">
                            <option value="true">Attivo</option>
                            <option value="false">Inattivo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Latitudine (Geolocalizzazione)</label>
                        <input type="text" id="editLat">
                    </div>
                    <div class="form-group">
                        <label>Longitudine (Geolocalizzazione)</label>
                        <input type="text" id="editLon">
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script type="module">
        import "./core/auth-service.js";
        import { db, auth } from "./core/firebase-init.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, getCountFromServer, doc, updateDoc, deleteDoc, addDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { CompanyContext } from "./core/CompanyContext.js";
        // CONFIGURATION FLAGS
        const GEOLOCATION_WRITE_READY = true; // Abilitato scrittura sicura su lat/lng
        const EDITABLE_FIELDS = ["nome", "indirizzo", "cap", "citta", "provincia", "codice_zona", "finestre_consegna", "attivo", "geolocalizzazione"];
        const TENANT_ID_MAP = {
            "DNR": "AgvcnbuUMu7YhzSuUKTY",
            "GRAN CHEF": "UZC65YbnIbXsei88xNBX",
            "CATTEL": "bSomOWB7pieGNej2KdJA",
            "BAUER": "bXOveycf4bEXv2aCkyMU"
        };
        function resolveTenantId(labelOrId) {
            if (Object.values(TENANT_ID_MAP).includes(labelOrId)) return labelOrId;
            return TENANT_ID_MAP[labelOrId] || null;
        }
        let fullData = [];
        let associationMap = {};
        let activeTenantId = null;
        // Map Globals
        let mapInstance = null;
        let mapMarker = null;
        // ==========================================
        // TYPE RESOLVER M5
        // ==========================================
        function resolvePointType(d) {
            let sc = d.sottocodice ? String(d.sottocodice).trim().toUpperCase() : "";
            if (sc === "FRUTTA" || sc === "LATTE") return sc;
            return "UNKNOWN";
        }
        function buildAssociationMap(dataList) {
            fullData = dataList;
            associationMap = {};
            fullData.forEach(d => {
                if (d.association_group_id) {
                    if (!associationMap[d.association_group_id]) {
                        associationMap[d.association_group_id] = [];
                    }
                    associationMap[d.association_group_id].push(d);
                }
            });
        }
        function formatExternalCode(val) {
            if (!val) return '-';
            let str = String(val).trim();
            if (str.toUpperCase().startsWith('P')) {
                str = str.substring(1);
            }
            return str;
        }
        function formatTimeWindows(arr) {
            if (!arr || !Array.isArray(arr)) return "Non def.";
            return arr.map(w => {
                if (w.da && w.a) return w.da + " - " + w.a;
                if (w.start && w.end) return w.start + " - " + w.end;
                return JSON.stringify(w);
            }).join(", ");
        }
        function renderList() {
            const search = document.getElementById("searchInput").value.toLowerCase().trim();
            const typeF = document.getElementById("typeFilter").value;
            const statusF = document.getElementById("statusFilter").value;
            let filtered = fullData.filter(d => {
                const type = resolvePointType(d);
                // Tipo
                if (typeF !== "ALL" && type !== typeF) return false;
                // Stato
                if (statusF === "ACTIVE" && d.attivo === false) return false;
                if (statusF === "INACTIVE" && d.attivo !== false) return false;
                // Testo
                if (search) {
                    const match = (
                        (d.nome && d.nome.toLowerCase().includes(search)) ||
                        (d.codice_esterno && d.codice_esterno.toLowerCase().includes(search)) ||
                        (d.citta && d.citta.toLowerCase().includes(search))
                    );
                    if (!match) return false;
                }
                return true;
            });
            const statsEl = document.getElementById("stats");
            let fC = 0, lC = 0, uC = 0;
            fullData.forEach(d => {
                let t = resolvePointType(d);
                if(t==="FRUTTA") fC++;
                else if(t==="LATTE") lC++;
                else uC++;
            });
            statsEl.innerText = `Trovati ${filtered.length} su ${fullData.length} (FRUTTA: ${fC}, LATTE: ${lC}, UNKNOWN: ${uC})`;
            const container = document.getElementById("listContainer");
            container.innerHTML = "";
            let html = "";
            filtered.forEach(d => {
                const type = resolvePointType(d);
                let isFrutta = type === "FRUTTA";
                let isLatte = type === "LATTE";
                let rawCode = d.codice_esterno || "-";
                let primaryCode = formatExternalCode(rawCode);
                let primaryBadge = `<span class="badge" style="background:#e2e8f0; color:#475569">Codice: ${primaryCode}</span>`;
                if (isFrutta || isLatte) {
                    primaryBadge += ` <span class="badge" style="background:#f1f5f9; color:#0f172a;">Canale: ${type}</span>`;
                }
                primaryBadge += ` <span class="badge" style="background:#f8fafc; color:#64748b; border:1px dashed #cbd5e1;">Codice interno: ${d.codice_punto || "-"}</span>`;
                
                let assocHTML = "";
                if (d.association_group_id && associationMap[d.association_group_id]) {
                    const siblings = associationMap[d.association_group_id].filter(sib => sib.id !== d.id);
                    if (siblings.length > 0) {
                        let sibling = siblings[0];
                        let sibType = resolvePointType(sibling);
                        let sibRaw = sibling.codice_esterno || "-";
                        let sibCode = formatExternalCode(sibRaw);
                        assocHTML = `<span class="badge" style="background:#f8fafc; color:#64748b; border:1px dashed #cbd5e1;">&#128279; Associato: ${sibCode} ${sibType !== 'UNKNOWN' ? '('+sibType+')' : ''}</span>`;
                    }
                }
                // Tenant: cerca prima il nome nel campo dedicato, poi inverti la mappa ID→nome
                const tenantLabel = d.tenant_name || Object.keys(TENANT_ID_MAP).find(k => TENANT_ID_MAP[k] === d.tenant_id) || d.tenant_id || "N/A";
                let windows = formatTimeWindows(d.finestre_consegna);
                html += `
                    <div class="item-card" style="padding: 24px;">
                        <div class="card-header" style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px;">
                            <div>
                                <h4 class="card-title" style="margin:0; font-size:16px; font-weight:700; color:#1e293b; text-transform:uppercase;">${d.nome || 'Senza Nome'}</h4>
                                <!-- RIGA 1: codice primario + eventuale codice associato affiancati -->
                                <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center;">
                                    ${primaryBadge}${assocHTML ? ' ' + assocHTML : ''}
                                </div>
                                <!-- RIGA 2: Zona + Tenant + Stato, tutti sulla stessa riga -->
                                <div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; align-items:center;">
                                    ${d.codice_zona ? `<span class="badge" style="background:#f1f5f9; color:#64748b; font-size:10px;">ZONA: ${d.codice_zona}</span>` : ''}
                                    <span class="badge" style="background:var(--primary); color:white; font-size:10px;">${tenantLabel}</span>
                                    <span class="badge" style="background:${d.attivo !== false ? '#10b981' : '#ef4444'}; color:white; font-size:10px;">${d.attivo !== false ? 'ATTIVO' : 'INATTIVO'}</span>
                                </div>
                            </div>
                            <div class="item-actions" style="display:flex; gap:8px;">
                                <button class="btn-edit" data-action="edit" data-point-id="${d.id}" data-tenant-id="${d.tenant_id}" title="Modifica dati">
                                    <span class="material-icons-round" style="font-size:18px; pointer-events:none;">edit</span>
                                </button>
                                <button class="btn-edit" data-action="geo" data-point-id="${d.id}" data-tenant-id="${d.tenant_id}" title="Geolocalizza (Google Maps)">
                                    <span class="material-icons-round" style="font-size:18px; color:#10b981; pointer-events:none;">my_location</span>
                                </button>
                                <button class="btn-edit" data-action="delete" data-point-id="${d.id}" data-tenant-id="${d.tenant_id}" title="Elimina punto di consegna">
                                    <span class="material-icons-round" style="font-size:18px; color:#ef4444; pointer-events:none;">delete</span>
                                </button>
                            </div>
                        </div>

                        <div class="card-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; padding-top:16px; border-top:1px solid #f1f5f9;">
                            <div>
                                <div style="font-size:10px; font-weight:700; color:#64748b; letter-spacing:0.5px; margin-bottom:4px;">INDIRIZZO</div>
                                <div style="font-size:13px; color:#334155; font-weight:500;">${d.indirizzo || '-'}</div>
                            </div>
                            <div>
                                <div style="font-size:10px; font-weight:700; color:#64748b; letter-spacing:0.5px; margin-bottom:4px;">CITTÀ / PROV</div>
                                <div style="font-size:13px; color:#334155; font-weight:500;">${d.citta || '-'} <br><span style="opacity:0.7">(${d.provincia || '-'})</span></div>
                            </div>
                        </div>

                        <div class="card-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; padding:12px; background:#f8fafc; border-radius:8px;">
                            <div>
                                <div style="font-size:10px; font-weight:700; color:#64748b; letter-spacing:0.5px; margin-bottom:4px;">ORARI</div>
                                <div style="font-size:13px; color:#0f172a; font-weight:600;">${windows}</div>
                            </div>
                            <div>
                                <div style="font-size:10px; font-weight:700; color:#64748b; letter-spacing:0.5px; margin-bottom:4px;">COORDINATE GPS</div>
                                <div style="font-size:13px; color:#0f172a; font-weight:600;">
                                    ${(d.geolocalizzazione && (d.geolocalizzazione.lat || d.geolocalizzazione.latitude)) ? parseFloat(d.geolocalizzazione.lat || d.geolocalizzazione.latitude).toFixed(4) + '/' + parseFloat(d.geolocalizzazione.lon || d.geolocalizzazione.longitude || d.geolocalizzazione.lng).toFixed(4) : '-'}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
        async function init(user) {
            const statsEl = document.getElementById("stats");
            const listContainer = document.getElementById("listContainer");
            
            try {
                // Fetch dynamic tenants from Firestore
                const tenantsSnap = await getDocs(collection(db, CompanyContext.getCompanyPath() + "/tenants"));
                const allTenants = tenantsSnap.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                
                const dynamicTenants = [];
                for (const t of allTenants) {
                    const countSnap = await getCountFromServer(collection(db, CompanyContext.getCompanyPath() + "/tenants/" + t.id + "/punti_consegna"));
                    if (countSnap.data().count > 0) {
                        dynamicTenants.push(t);
                    }
                }
                
                let tenantSelectBox = document.getElementById("tenantSelectBox");
                
                // Pulisci i listener precedenti clonando se necessario, oppure aggiungi uno nuovo solo la prima volta
                if (!tenantSelectBox.hasAttribute('data-listener-attached')) {
                    tenantSelectBox.addEventListener("change", (e) => {
                        const val = e.target.value;
                        if (val) {
                            localStorage.setItem("activeTenant", val);
                            window.location.reload();
                        }
                    });
                    tenantSelectBox.setAttribute('data-listener-attached', 'true');
                }
                
                // Populate options
                tenantSelectBox.innerHTML = '<option value="" style="color: black;">Seleziona tenant...</option>';
                dynamicTenants.forEach(t => {
                    const code = t.nome || t.name || t.id;
                    const opt = document.createElement("option");
                    opt.value = code;
                    opt.text = code;
                    opt.style.color = "black";
                    opt.dataset.tenantId = t.id;
                    tenantSelectBox.appendChild(opt);
                });
                
                
                // --- INIZIO DIAGNOSTICA TENANT_ID ---
                let missingTenant = 0;
                let invalidTenant = 0;
                fullData.forEach(d => {
                    if (!d.tenant_id) {
                        missingTenant++;
                    } else if (typeof TENANT_ID_MAP !== "undefined" && !Object.keys(TENANT_ID_MAP).find(k => TENANT_ID_MAP[k] === d.tenant_id)) {
                        invalidTenant++;
                    }
                });
                const diagMsg = (missingTenant > 0 || invalidTenant > 0) 
                    ? ` ⚠️ ATTENZIONE: ${missingTenant} record SENZA tenant_id, ${invalidTenant} con tenant_id SCONOSCIUTO.` 
                    : ` ✅ Tutti i record hanno un tenant_id valido.`;
                // --- FINE DIAGNOSTICA ---

                const activeTenantCode = localStorage.getItem("activeTenant") || "ALL";
                
                // Gestione ALL mode vs singola tenant
                if (activeTenantCode === "ALL") {
                    tenantSelectBox.value = "ALL";
                    activeTenantId = "ALL";
                    fullData = [];
                    for (const t of dynamicTenants) {
                        const path = CompanyContext.getDeliveryPointsPath(t.id);
                        const snapshot = await getDocs(collection(db, path));
                        snapshot.docs.forEach(doc => {
                            fullData.push({ id: doc.id, tenant_id: t.id, tenant_name: t.nome || t.name || t.id, ...doc.data() });
                        });
                    }
                } else {
                    const selectedTenant = dynamicTenants.find(t => (t.nome || t.name || t.id) === activeTenantCode);
                    
                    if (!selectedTenant) {
                        tenantSelectBox.value = "ALL";
                        localStorage.setItem("activeTenant", "ALL");
                        window.location.reload();
                        return;
                    }
                    
                    tenantSelectBox.value = activeTenantCode;
                    activeTenantId = selectedTenant.id;
                    
                    const path = CompanyContext.getDeliveryPointsPath(activeTenantId);
                    const snapshot = await getDocs(collection(db, path));
                    fullData = snapshot.docs.map(doc => ({ id: doc.id, tenant_id: activeTenantId, tenant_name: activeTenantCode, ...doc.data() }));
                }
                
                // --- INIZIO AGGIORNAMENTO DINAMICO CANALI ---
                const typesFound = new Set();
                fullData.forEach(d => {
                    const t = resolvePointType(d);
                    if(t) typesFound.add(t);
                });
                const typeFilter = document.getElementById("typeFilter");
                if (typeFilter) {
                    const currentVal = typeFilter.value;
                    typeFilter.innerHTML = '<option value="ALL">Tutti i canali</option>';
                    if (typesFound.size > 0) {
                        typeFilter.style.display = "inline-block";
                        Array.from(typesFound).sort().forEach(t => {
                            typeFilter.innerHTML += `<option value="${t}">${t.charAt(0) + t.slice(1).toLowerCase()}</option>`;
                        });
                        if (typesFound.has(currentVal)) typeFilter.value = currentVal;
                    } else {
                        typeFilter.style.display = "none"; // Hide if no channels
                    }
                }
                // --- FINE AGGIORNAMENTO DINAMICO CANALI ---

                
                buildAssociationMap(fullData);
                
                if (fullData.length === 0) {
                    listContainer.innerHTML = `<div class="empty-state">Nessun punto di consegna presente per questo tenant.</div>`;
                    listContainer.classList.remove("cards-container");
                    statsEl.innerText = "0 record";
                } else {
                    listContainer.classList.add("cards-container");
                    renderList();
                    // Mostra diagnostica tenant_id inline nelle stats
                    const statsEl2 = document.getElementById("stats");
                    if (statsEl2) statsEl2.innerText += diagMsg;
                }
                
            } catch (err) {
                console.error("[Punti di Consegna] Errore inizializzazione:", err);
                statsEl.innerText = "Errore di caricamento: " + err.message;
            }
        }
        
        window.openEditModal = function(id, tenantId) {
            const modal = document.getElementById("editModal");
            if (!modal) return;
            const form = document.getElementById("editForm");
            form.reset();
            
            if (id) {
                const pt = fullData.find(x => x.id === id);
                if (pt) {
                    document.getElementById("editId").value = pt.id || "";
                    document.getElementById("editTenantId").value = pt.tenant_id || tenantId || "";
                    document.getElementById("editCodicePunto").value = pt.codice_punto || "";
                    document.getElementById("editCodiceEsterno").value = pt.codice_esterno || "";
                    document.getElementById("editSottocodice").value = pt.sottocodice || "";
                    document.getElementById("editNome").value = pt.nome || "";
                    document.getElementById("editIndirizzo").value = pt.indirizzo || "";
                    document.getElementById("editCap").value = pt.cap || "";
                    document.getElementById("editCitta").value = pt.citta || "";
                    document.getElementById("editProvincia").value = pt.provincia || "";
                    document.getElementById("editLat").value = (pt.geolocalizzazione && (pt.geolocalizzazione.lat || pt.geolocalizzazione.latitude)) ? (pt.geolocalizzazione.lat || pt.geolocalizzazione.latitude) : "";
                    document.getElementById("editLon").value = (pt.geolocalizzazione && (pt.geolocalizzazione.lon || pt.geolocalizzazione.longitude || pt.geolocalizzazione.lng)) ? (pt.geolocalizzazione.lon || pt.geolocalizzazione.longitude || pt.geolocalizzazione.lng) : "";
                    document.getElementById("editModalSubtitle").innerText = "ID: " + id;
                    if (document.getElementById("editStato")) {
                        document.getElementById("editStato").value = pt.attivo !== false ? "true" : "false";
                    }
                }
            } else {
                document.getElementById("editId").value = "";
                document.getElementById("editTenantId").value = activeTenantId === "ALL" ? "" : activeTenantId;
                document.getElementById("editModalSubtitle").innerText = "Nuovo Punto";
            }
            modal.style.display = "flex";
        };

        window.closeEditModal = function() {
            const modal = document.getElementById("editModal");
            if (modal) modal.style.display = "none";
        };

        window.saveEdit = async function() {
            const id = document.getElementById("editId").value;
            const nome = document.getElementById("editNome").value;
            if (!nome) return alert("Inserisci il nome");
            
            const latStr = document.getElementById("editLat").value;
            const lonStr = document.getElementById("editLon").value;
            const lat = parseFloat(latStr);
            const lon = parseFloat(lonStr);
            
            let saveTenantId = document.getElementById("editTenantId").value;
            if (!saveTenantId) saveTenantId = activeTenantId;
            if (saveTenantId === "ALL") {
                return alert("Impossibile salvare: tenant non specificato.");
            }
            
            const path = CompanyContext.getDeliveryPointsPath(saveTenantId);
            try {
                if (id) {
                    const dataToUpdate = {
                        nome: nome,
                        codice_esterno: document.getElementById("editCodiceEsterno").value,
                        indirizzo: document.getElementById("editIndirizzo").value,
                        cap: document.getElementById("editCap").value,
                        citta: document.getElementById("editCitta").value,
                        provincia: document.getElementById("editProvincia").value,
                        attivo: document.getElementById("editStato") ? document.getElementById("editStato").value === "true" : true
                    };
                    if (!isNaN(lat) && !isNaN(lon)) {
                        dataToUpdate.geolocalizzazione = { lat: lat, lon: lon };
                    }
                    await setDoc(doc(db, path, id), dataToUpdate, { merge: true });
                } else {
                    alert("Creazione nuovo punto temporaneamente sospesa durante l'allineamento del sistema.");
                    return;
                }
                closeEditModal();
                init(auth.currentUser); // Reload
            } catch (e) {
                console.error(e);
                alert("Errore salvataggio: " + e.message);
            }
        };

        window.deletePoint = async function(id, tenantId) {
            if(!confirm("Sei sicuro di voler eliminare questo punto di consegna? L'operazione è irreversibile.")) return;
            try {
                const targetTenant = tenantId || activeTenantId;
                if (targetTenant === "ALL") return alert("Errore: tenant non identificato.");
                const path = CompanyContext.getDeliveryPointsPath(targetTenant);
                await deleteDoc(doc(db, path, id));
                init(auth.currentUser); // Reload
                alert("Punto di consegna eliminato.");
            } catch(e) {
                console.error(e);
                alert("Errore durante l'eliminazione: " + e.message);
            }
        };

        window.openMapModal = function(id, tenantId) {
            let tenantLabel = "ALL";
            if (tenantId && tenantId !== "ALL") {
                const tCode = Object.keys(TENANT_ID_MAP).find(k => TENANT_ID_MAP[k] === tenantId);
                tenantLabel = tCode || tenantId;
            } else {
                tenantLabel = localStorage.getItem("activeTenant");
            }
            window.navigateWithState('mappa_google.html?id=' + encodeURIComponent(id) + '&tenant=' + encodeURIComponent(tenantLabel));
        };

        window.closeMapModal = function() {
            const modal = document.getElementById("mapModal");
            if (modal) modal.style.display = "none";
        };

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("searchInput").addEventListener("input", renderList);
            document.getElementById("typeFilter").addEventListener("change", renderList);
            document.getElementById("statusFilter").addEventListener("change", renderList);
            // Event Delegation for action buttons
            document.getElementById("listContainer").addEventListener("click", (e) => {
                const btn = e.target.closest(".btn-edit");
                if (!btn) return;
                const action = btn.getAttribute("data-action");
                const pointId = btn.getAttribute("data-point-id");
                const tenantId = btn.getAttribute("data-tenant-id");
                if (action === "geo" && pointId) {
                    window.openMapModal(pointId, tenantId);
                } else if (action === "edit" && pointId) {
                    window.openEditModal(pointId, tenantId);
                } else if (action === "delete" && pointId) {
                    window.deletePoint(pointId, tenantId);
                }
            });
        });
        onAuthStateChanged(auth, (user) => {
            if (user) {
                init(user);
            }
        });
    </script>
