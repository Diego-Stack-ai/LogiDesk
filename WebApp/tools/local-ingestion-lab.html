<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogiDesk — Laboratorio ingestion</title>
<style>body{font:15px system-ui;margin:0;background:#f3f6fb;color:#172033}main{max-width:1250px;margin:auto;padding:22px}.card{background:white;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #21304a15}.safe{background:#eaf9ef;color:#176334;padding:12px;border-radius:10px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{display:grid;gap:5px;font-weight:650}input,select,button{font:inherit;padding:10px;border:1px solid #c9d3e3;border-radius:9px}button{background:#2855d9;color:#fff;font-weight:750;cursor:pointer}button:disabled{opacity:.5}.tabs{display:flex;gap:8px}.tabs button{background:#e7edfa;color:#25324a}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px;border:1px solid #dce3ee;text-align:left;vertical-align:top}th{background:#edf2fa}.scroll{overflow:auto;max-height:760px}.warn{color:#a33}.pill{display:inline-block;background:#e9eef9;padding:3px 8px;border-radius:12px;margin:2px}pre{white-space:pre-wrap}.compare-card{margin:18px 0;border:1px solid #dce3ee;border-radius:12px;overflow:hidden}.compare-card h3{margin:0;padding:11px 14px;background:#edf2fa}.compare-card table{min-width:1000px}.compare-card tr.diff td:not(:first-child){background:#fff1f1}.compare-card tr.missing td{background:#fff7dc}.source{font-weight:800;white-space:nowrap}.secondary{background:#f8fafc}</style></head>
<body><main><h1>Laboratorio locale di importazione</h1><div class="safe">Modalità prova: nessuna connessione Firebase, nessuna modifica all’app pubblicata.</div>
<section class="card"><div class="grid"><label>File PDF<input id="file" type="file" accept="application/pdf,.pdf"></label><label>Committente<input id="tenant" value="DNR" required></label><label>Canale<select id="channel"><option>LATTE</option><option>FRUTTA</option></select></label><label>DDT da far leggere anche all’AI<input id="aiDdt" placeholder="es. FNS17765"></label><label><span>Formato sconosciuto</span><span><input id="aiUnknown" type="checkbox" checked> Analizza con Qwen 3.5</span></label></div><p><button id="process">Elabora localmente</button> <span id="status"></span></p></section>
<section class="card" id="summary" hidden></section><section class="card" id="review" hidden><h2>Revisione proposte</h2><div class="tabs"><button data-group="delivery_points">Punti</button><button data-group="travel_notes">Note viaggio</button><button data-group="articles">Articoli</button><button data-group="ai_result">Risultato AI</button></div><div id="table" class="scroll"></div><p><button id="save">Salva sessione nella cartella locale</button></p></section>
<section class="card" id="firebaseCompare"><h2>Confronto read-only con LogiDesk Cantiere</h2><p>Le credenziali vengono inviate direttamente a Firebase Auth e non transitano nel server locale.</p><p><button id="loadLatest">Carica l’ultima sessione locale salvata</button> <span id="loadStatus"></span></p><div class="grid"><label>Nome utente o email LogiDesk<input id="fbEmail" type="text" autocomplete="username" placeholder="es. mario.rossi o email completa"><small id="normalizedLogin"></small></label><label>Password<input id="fbPassword" type="password" autocomplete="current-password"></label></div><p><button id="fbLogin">Accedi e confronta tutti i punti</button> <span id="fbStatus"></span></p><div id="fbComparison"></div></section>
<section class="card" id="saved" hidden></section></main><script>
let result=null,current='delivery_points';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const rows=result?.[current];if(!Array.isArray(rows)){ $('table').innerHTML=`<pre>${esc(JSON.stringify(rows||{},null,2))}</pre>`;return;}if(!rows.length){$('table').innerHTML='<p>Nessun record.</p>';return;}const keys=[...new Set(rows.flatMap(Object.keys))].filter(k=>k!=='sources'&&k!=='source');$('table').innerHTML=`<table><thead><tr><th>Approva per staging</th>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.map((row,i)=>`<tr><td><input type="checkbox" data-approve="${current}:${i}"></td>${keys.map(k=>`<td>${typeof row[k]==='object'?`<pre>${esc(JSON.stringify(row[k],null,2))}</pre>`:esc(row[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{current=b.dataset.group;render();});
$('process').onclick=async()=>{const file=$('file').files[0],tenant=$('tenant').value.trim();if(!file||!tenant)return alert('Seleziona PDF e committente.');$('process').disabled=true;$('status').textContent='Elaborazione in corso…';try{const base64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(file)});const response=await fetch('/api/process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file_name:file.name,file_base64:base64,tenant_id:tenant,channel:$('channel').value,ai_ddt:$('aiDdt').value.trim()||null,ai_unknown:$('aiUnknown').checked})});result=await response.json();window.labResult=result;if(!response.ok)throw Error(result.error||'Errore');$('summary').hidden=false;$('summary').innerHTML=`<h2>Esito</h2><span class="pill">${result.delivery_points.length} punti</span><span class="pill">${result.travel_notes.length} note</span><span class="pill">${result.articles.length} articoli</span><span class="pill">0 scritture remote</span>`;$('review').hidden=false;render();$('status').textContent='Completato';}catch(e){$('status').innerHTML=`<span class="warn">${esc(e.message)}</span>`}finally{$('process').disabled=false}};
$('save').onclick=async()=>{const approvals={};document.querySelectorAll('[data-approve]:checked').forEach(x=>approvals[x.dataset.approve]=true);const response=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({result,approvals})});const data=await response.json();if(!response.ok)return alert(data.error);window.lastLabSessionId=data.session_id;$('saved').hidden=false;$('saved').innerHTML=`<h2>Sessione locale salvata</h2><p><code>${esc(data.folder)}</code></p><p>Firebase writes: ${data.firebase_writes}; Storage writes: ${data.storage_writes}</p>`};
$('loadLatest').onclick=async()=>{const response=await fetch('/api/latest-session'),data=await response.json();if(!response.ok)return $('loadStatus').textContent=data.error;result=data.result;window.labResult=result;window.lastLabSessionId=data.session_id;$('summary').hidden=false;$('summary').innerHTML=`<h2>Sessione ricaricata</h2><span class="pill">${result.delivery_points.length} punti</span><span class="pill">${result.travel_notes.length} note</span><span class="pill">${result.articles.length} articoli</span><span class="pill">0 scritture remote</span>`;$('review').hidden=false;render();$('loadStatus').textContent=`${data.session_id} · ${result.file_name}`};
</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import {getFirestore,collection,getDocs} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
const config={apiKey:'AIzaSyD6kcBZyrPi9Pe_NZenbQzhP1Q6otYh8Ew',authDomain:'log-solutions-cantiere.firebaseapp.com',projectId:'log-solutions-cantiere',appId:'1:646843725221:web:e56143098e6e6dcfb8e44c'};
const app=initializeApp(config,'local-readonly-lab'),auth=getAuth(app),db=getFirestore(app),company='NzXaCgyXxZWWehw1tSlo';
const norm=v=>String(v??'').trim().replace(/\s+/g,' ').toUpperCase(); const safe=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fields=['codice_punto_committente','denominazione_punto','indirizzo','cap','localita','provincia','telefono','referente'];
const aliases={codice_punto_committente:['codice_esterno','codice_punto_committente','codice_punto','codice'],denominazione_punto:['nome','denominazione_punto','denominazione','cliente','destinazione'],indirizzo:['indirizzo'],cap:['cap'],localita:['citta','localita'],provincia:['provincia','prov'],telefono:['telefono','cellulare','tel'],referente:['referente','contatto']};
const remoteValue=(row,field)=>{for(const key of aliases[field]||[field])if(row?.[key]!==undefined&&row[key]!==null&&row[key]!=='')return row[key];return null};
const normalizeLogin=value=>{let email=String(value||'').trim().toLowerCase().replace(/[\u200B-\u200D\uFEFF]/g,'');if(!email)return'';if(!email.includes('@'))email=email.replace(/\s+/g,'.').replace(/\.+/g,'.').replace(/^\.|\.$/g,'')+'@logsolution.app';else email=email.replace(/\s+/g,'');return email};
document.getElementById('fbEmail').oninput=event=>{const email=normalizeLogin(event.target.value);document.getElementById('normalizedLogin').textContent=email?`Accesso come: ${email}`:''};
document.getElementById('fbLogin').onclick=async()=>{const status=document.getElementById('fbStatus'),box=document.getElementById('fbComparison'),local=window.labResult;if(!local?.delivery_points?.length)return alert('Prima elabora un file oppure carica l’ultima sessione locale.');status.textContent='Accesso e lettura in corso…';try{if(!auth.currentUser){const email=normalizeLogin(document.getElementById('fbEmail').value),password=document.getElementById('fbPassword').value.trim();if(!email||!password)throw Error('Inserisci nome utente/email e password');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw Error(`Il nome utente produce un indirizzo non valido: ${email}`);await signInWithEmailAndPassword(auth,email,password);}document.getElementById('fbPassword').value='';const tenantSnap=await getDocs(collection(db,`aziende/${company}/tenants`));const wanted=norm(local.tenant_id);const tenant=tenantSnap.docs.map(d=>({id:d.id,...d.data()})).find(t=>[t.id,t.nome,t.name,t.codice,t.denominazione,t.nome_tenant,t.codice_tenant].some(v=>norm(v)===wanted));if(!tenant)throw Error(`Committente ${local.tenant_id} non trovato nel Cantiere`);const remoteSnap=await getDocs(collection(db,`aziende/${company}/tenants/${tenant.id}/punti_consegna`));const remote=remoteSnap.docs.map(d=>({id:d.id,...d.data()}));const byCode=new Map(remote.map(p=>[norm(remoteValue(p,'codice_punto_committente')),p]));let same=0,different=0,missing=0;const pairs=local.delivery_points.map(point=>{const stored=byCode.get(norm(point.codice_punto_committente));if(!stored){missing++;return{code:point.codice_punto_committente,local:point,remote:null,status:'NON PRESENTE'}};const values={};let changed=false;for(const f of fields){const rv=remoteValue(stored,f);values[f]={local:point[f]??null,remote:rv,equal:norm(point[f])===norm(rv)};if(!values[f].equal)changed=true;}changed?different++:same++;return{code:point.codice_punto_committente,local:point,remote:stored,values,status:changed?'DIVERSO':'IDENTICO'};});box.innerHTML=pairs.map(pair=>`<article class="compare-card"><h3>${safe(pair.code)} · ${safe(pair.status)}</h3><div class="scroll"><table><thead><tr><th>Sorgente</th>${fields.map(f=>`<th>${safe(f)}</th>`).join('')}</tr></thead><tbody><tr><td class="source">Laboratorio</td>${fields.map(f=>`<td>${safe(pair.local[f])}</td>`).join('')}</tr><tr class="secondary ${pair.remote?'':'missing'}"><td class="source">LogiDesk</td>${fields.map(f=>{const rv=remoteValue(pair.remote,f),eq=norm(pair.local[f])===norm(rv);return`<td class="${eq?'':'diff'}">${safe(rv)}</td>`}).join('')}</tr></tbody></table></div></article>`).join('');status.textContent=`Confrontati ${pairs.length}: ${same} identici, ${different} diversi, ${missing} non presenti. Zero scritture.`;if(window.lastLabSessionId){const matched=pairs.filter(p=>p.remote).map(p=>p.remote);const saved=await fetch('/api/save-comparison',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:window.lastLabSessionId,tenant_document_id:tenant.id,remote_snapshot:matched,comparison:pairs})});if(!saved.ok)throw Error('Confronto visualizzato ma non salvato nella sessione locale');}}catch(e){document.getElementById('fbPassword').value='';const authMessages={'auth/invalid-credential':'Nome utente/email o password non validi','auth/invalid-email':'Il nome utente o indirizzo email non ha un formato valido'};status.innerHTML=`<span class="warn">${safe(authMessages[e.code]||e.message)}</span>`}};
</script></body></html>
