<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiDesk</title>
    <link rel="stylesheet" href="styles.css?v=6.431">
    <link rel="preload" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"></noscript>

    <!-- PWA & Mobile Optimization -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LogiDesk">
    <link rel="apple-touch-icon" href="assets/brand/logidesk-mark.svg">
    <meta name="theme-color" content="#4f46e5">
</head>

<body class="center-content">
    <div class="glass-panel login-card">
        <div class="login-header">
            <img src="assets/brand/logidesk-logo.svg" alt="LogiDesk" style="width: 100%; max-width: 280px; height: auto; margin-bottom: 20px; object-fit: contain;">
            <p style="color: #6b7280; font-size: 14px; margin-bottom: 20px;">Gestione logistica</p>
        </div>

        <form id="loginForm">
            <div id="authAlert" style="display:none; padding:12px; margin-bottom:20px; border-radius:12px; font-size:13px; text-align:center; font-weight:500; border:1px solid transparent;"></div>

            <div class="input-group">
                <label>Nome Utente o Email</label>
                <input type="text" id="username" placeholder="es. mario.rossi o email completa" autocomplete="username" 
                    autocapitalize="none" autocorrect="off" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                    <span class="password-toggle" onclick="window.togglePasswordVisibility()">
                        <span class="material-icons-round" id="toggleIcon">visibility</span>
                    </span>
                </div>
            </div>
            
            <button type="button" id="loginBtn" class="btn-primary" style="margin-bottom: 12px;">Accedi ora</button>
            <p style="font-size: 11px; color: var(--text-muted); opacity: 0.8; text-align: center; margin: 0;">
                LogiDesk Team &copy; 2026
        </form>
    </div>

    <script src="script.js?v=6.431"></script>
    <script type="module" src="core/firebase-init.js?v=6.431"></script>
    <script type="module" src="core/auth-service.js?v=6.431"></script>
    <script>
        // Qualsiasi script aggiuntivo per login
    </script>
</body>
</html>
