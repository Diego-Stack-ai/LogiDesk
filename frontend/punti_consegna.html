<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiDesk - Punti di Consegna</title>
    <link rel="stylesheet" href="styles.css?v=6.436">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="manifest" href="manifest.json">

    <!-- Leaflet per mappa modale -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        .list-container {
            display: grid; margin-top: 12px;
            max-height: 75vh; overflow-y: auto; padding-right: 12px;
            padding-bottom: 20px;
        }
        .list-container::-webkit-scrollbar { width: 8px; }
        .list-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .list-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .list-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filters input, .filters select {
            padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-family: inherit; font-size: 0.9rem;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }

        .item-card {
            background: white;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .item-card:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 25px -10px rgba(79, 70, 229, 0.15);
        }

        .item-card.inactive {
            opacity: 0.7;
            border-left: 4px solid #ef4444;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 12px;
        }

        .card-title {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-main);
            margin: 0;
        }

        .card-body {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            flex-grow: 1;
        }

        .card-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .data-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .data-value {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
        }

        .badge {
            padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; display: inline-block;
        }
        .badge.frutta { background-color: #f59e0b; }
        .badge.latte { background-color: #3b82f6; }

        .association-group {
            font-size: 11px; color: #64748b; margin-top: 8px; background: #f1f5f9; padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 4px; font-weight: 500;
        }

        .empty-state {
            padding: 40px; text-align: center; color: var(--text-muted); background: white; border-radius: 16px; border: 1px dashed #e2e8f0; font-weight: 500;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 800px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
        }
        .modal-body {
            flex-grow: 1;
            position: relative;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-body.map-body { padding: 0; }

        #leafletMap {
            width: 100%;
            height: 100%;
        }
        .btn-icon {
            background: none; border: none; cursor: pointer; color: #64748b; display: flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; border: 1px solid #e2e8f0;
        }
        .btn-icon:hover { background: #f1f5f9; }

        .card-actions {
            display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; border-top: 1px solid #f1f5f9; padding-top: 12px;
        }

        /* Edit Form */
        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
        }
        .form-group {
            display: flex; flex-direction: column; gap: 6px;
        }
        .form-group label {
            font-size: 12px; font-weight: 600; color: #64748b;
        }
        .form-group input, .form-group select {
            padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-family: inherit; font-size: 14px;
        }
        .form-group input:read-only { background: #f8fafc; color: #94a3b8; }

        /* Header Fix */
        .glass-nav {
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 10px 20px;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .nav-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            background: linear-gradient(135deg, #fff, rgba(255,255,255,0.7));
            color: var(--primary);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link:hover, .nav-link.active {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <nav class="glass-nav">
        <div class="nav-content">
            <div class="nav-left">
                <div class="logo">
                    <div class="logo-icon">
                        <span class="material-icons-round">local_shipping</span>
                    </div>
                    LogiDesk <span id="tenantDisplay" style="font-size: 12px; opacity: 0.8; font-weight:normal; margin-left:8px;"></span>
                </div>
                <div class="nav-links">
                    <a href="dashboard.html" class="nav-link"><span class="material-icons-round">dashboard</span> Dashboard</a>
                    <a href="#" class="nav-link active"><span class="material-icons-round">storefront</span> Punti Consegna</a>
                </div>
            </div>
            <button onclick="window.AuthService.logout()" class="logout-btn" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                <span class="material-icons-round" style="font-size: 16px;">logout</span> Esci
            </button>
        </div>
    </nav>

    <main class="main-container">
        <div class="filters">
            <input type="text" id="searchInput" placeholder="Cerca per nome, codice, indirizzo o citta'..." style="flex: 1; min-width: 250px;">
            <select id="typeFilter" style="cursor: pointer;">
                <option value="ALL">Tutte le Competenze</option>
                <option value="FRUTTA">Frutta</option>
                <option value="LATTE">Latte</option>
            </select>
            <select id="statusFilter" style="cursor: pointer;">
                <option value="ALL">Tutti gli stati</option>
                <option value="ATTIVI">Attivi</option>
                <option value="INATTIVI">Inattivi</option>
            </select>
        </div>

        <div id="stats" style="margin-bottom: 12px; font-weight: 600; font-size: 13px; color: #64748b; padding-left: 4px;">Caricamento in corso...</div>

        <div id="listContainer" class="list-container cards-container">
            <!-- Items rendered via JS -->
        </div>
    </main>

    <!-- Map Modal -->
    <div class="modal-overlay" id="mapModal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3 style="margin:0; font-size: 16px; color:#1e293b;" id="modalMapTitle">Geolocalizzazione Punto</h3>
                    <div style="font-size: 12px; color:#64748b; margin-top:4px;" id="modalMapSubtitle">Coordinate: N/D</div>
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="btn-icon" style="background:#ef4444; color:white; border:none;" onclick="closeMapModal()">Chiudi</button>
                </div>
            </div>
            <div class="modal-body map-body">
                <div id="leafletMap"></div>
                <div id="noMapOverlay" style="display:none; position:absolute; top:0; left:0; right:0; bottom:0; background:#f8fafc; z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#64748b;">
                    <span class="material-icons-round" style="font-size:48px; margin-bottom:12px; opacity:0.5;">location_off</span>
                    <h3 style="margin:0;">Coordinate non presenti</h3>
                    <p style="font-size:13px;">Impossibile visualizzare il punto sulla mappa.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content" style="max-width: 600px; height: auto; max-height: 90vh;">
            <div class="modal-header">
                <div>
                    <h3 style="margin:0; font-size: 16px; color:#1e293b;">Modifica Punto di Consegna</h3>
                    <div style="font-size: 12px; color:#64748b; margin-top:4px;" id="editModalSubtitle">ID: ...</div>
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="btn-icon" style="background:#ef4444; color:white; border:none;" onclick="closeEditModal()">Annulla</button>
                    <button class="btn-icon" style="background:#10b981; color:white; border:none;" onclick="saveEdit()">Salva</button>
                </div>
            </div>
            <div class="modal-body">
                <form id="editForm" class="form-grid">
                    <input type="hidden" id="editId">

                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Nome Punto</label>
                        <input type="text" id="editNome" required>
                    </div>

                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Indirizzo</label>
                        <input type="text" id="editIndirizzo">
                    </div>

                    <div class="form-group">
                        <label>CAP</label>
                        <input type="text" id="editCap">
                    </div>

                    <div class="form-group">
                        <label>Città</label>
                        <input type="text" id="editCitta">
                    </div>

                    <div class="form-group">
                        <label>Provincia</label>
                        <input type="text" id="editProvincia" maxlength="2">
                    </div>

                    <div class="form-group">
                        <label>Zona</label>
                        <input type="text" id="editZona">
                    </div>

                    <div class="form-group">
                        <label>Finestre Consegna</label>
                        <input type="text" id="editFinestre">
                    </div>

                    <div class="form-group">
                        <label>Stato</label>
                        <select id="editStato">
                            <option value="true">Attivo</option>
                            <option value="false">Inattivo</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Latitudine (Geolocalizzazione)</label>
                        <input type="text" id="editLat">
                    </div>

                    <div class="form-group">
                        <label>Longitudine (Geolocalizzazione)</label>
                        <input type="text" id="editLng">
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import "./core/auth-service.js";
        import { db, auth } from "./core/firebase-init.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { CompanyContext } from "./core/CompanyContext.js";

        // CONFIGURATION FLAGS
        const GEOLOCATION_WRITE_READY = true; // Abilitato scrittura sicura su lat/lng
        const EDITABLE_FIELDS = ["nome", "indirizzo", "cap", "citta", "provincia", "codice_zona", "finestre_consegna", "attivo", "geolocalizzazione"];

        const TENANT_ID_MAP = {
            "DNR": "AgvcnbuUMu7YhzSuUKTY",
            "GRAN CHEF": "UZC65YbnIbXsei88xNBX",
            "CATTEL": "bSomOWB7pieGNej2KdJA",
            "BAUER": "bXOveycf4bEXv2aCkyMU"
        };

        function resolveTenantId(labelOrId) {
            if (Object.values(TENANT_ID_MAP).includes(labelOrId)) return labelOrId;
            return TENANT_ID_MAP[labelOrId] || null;
        }

        let fullData = [];
        let associationMap = {};
        let activeTenantId = null;

        // Map Globals
        let mapInstance = null;
        let mapMarker = null;

        // ==========================================
        // TYPE RESOLVER M5
        // ==========================================
        function resolvePointType(d) {
            if (d.tipo === "FRUTTA" || d.tipo === "LATTE") return d.tipo;
            if (d.competenza === "FRUTTA" || d.competenza === "LATTE") return d.competenza;

            if (d.legacy_provenance === "clienti_fatturazione") return "LATTE";
            if (d.legacy_provenance === "raccolta clienti") return "FRUTTA";
            if (d.source_type === "legacy_clienti_fatturazione") return "LATTE";
            if (d.source_type === "legacy_raccolta_clienti") return "FRUTTA";

            if (d.migration_metadata && d.migration_metadata.source === "clienti_fatturazione") return "LATTE";
            if (d.migration_metadata && d.migration_metadata.source === "raccolta_clienti") return "FRUTTA";

            // Last resort
            if (d.sottocodice && String(d.sottocodice).trim() !== "") return "LATTE";
            return "FRUTTA"; // Safest fallback
        }

        function buildAssociationMap(data) {
            associationMap = {};
            data.forEach(d => {
                if (d.association_group_id) {
                    if (!associationMap[d.association_group_id]) {
                        associationMap[d.association_group_id] = [];
                    }
                    associationMap[d.association_group_id].push(d);
                }
            });
        }

        // ==========================================
        // UI & MODALS
        // ==========================================
        window.openMapModal = function(id) {
            const point = fullData.find(d => d.id === id);
            if (!point) return;

            document.getElementById('mapModal').style.display = 'flex';

            const hasCoords = point.geolocalizzazione && point.geolocalizzazione.lat && point.geolocalizzazione.lng;

            if (!hasCoords) {
                document.getElementById('noMapOverlay').style.display = 'flex';
                document.getElementById('modalMapTitle').innerText = point.nome || 'Punto senza nome';
                document.getElementById('modalMapSubtitle').innerText = "Coordinate non presenti";
                return;
            }

            document.getElementById('noMapOverlay').style.display = 'none';
            const lat = parseFloat(point.geolocalizzazione.lat);
            const lng = parseFloat(point.geolocalizzazione.lng);

            document.getElementById('modalMapTitle').innerText = point.nome || 'Punto senza nome';
            document.getElementById('modalMapSubtitle').innerText = "Coordinate: " + lat.toFixed(5) + " / " + lng.toFixed(5);

            if (!mapInstance) {
                mapInstance = L.map('leafletMap').setView([lat, lng], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap'
                }).addTo(mapInstance);
            } else {
                mapInstance.setView([lat, lng], 15);
            }

            if (mapMarker) mapInstance.removeLayer(mapMarker);

            mapMarker = L.marker([lat, lng]).addTo(mapInstance);
            mapMarker.bindPopup("<b>" + (point.nome || 'Punto') + "</b>").openPopup();

            setTimeout(() => {
                mapInstance.invalidateSize();
            }, 300);
        }

        window.closeMapModal = function() {
            document.getElementById('mapModal').style.display = 'none';
        }

        window.openEditModal = function(id) {
            const point = fullData.find(d => d.id === id);
            if (!point) return;

            document.getElementById('editModal').style.display = 'flex';
            document.getElementById('editModalSubtitle').innerText = "ID: " + id;

            document.getElementById('editId').value = id;
            document.getElementById('editNome').value = point.nome || "";
            document.getElementById('editIndirizzo').value = point.indirizzo || "";
            document.getElementById('editCap').value = point.cap || "";
            document.getElementById('editCitta').value = point.citta || "";
            document.getElementById('editProvincia').value = point.provincia || "";
            document.getElementById('editZona').value = point.codice_zona || "";

            const windows = point.finestre_consegna ? (Array.isArray(point.finestre_consegna) ? point.finestre_consegna.join(", ") : point.finestre_consegna) : "";
            document.getElementById('editFinestre').value = windows;

            document.getElementById('editStato').value = point.attivo !== false ? "true" : "false";

            if (point.geolocalizzazione) {
                document.getElementById('editLat').value = point.geolocalizzazione.lat || "";
                document.getElementById('editLng').value = point.geolocalizzazione.lng || "";
            } else {
                document.getElementById('editLat').value = "";
                document.getElementById('editLng').value = "";
            }

            if (!GEOLOCATION_WRITE_READY) {
                document.getElementById('editLat').setAttribute('readonly', 'true');
                document.getElementById('editLng').setAttribute('readonly', 'true');
            }
        }

        window.closeEditModal = function() {
            document.getElementById('editModal').style.display = 'none';
        }

        window.saveEdit = async function() {
            const id = document.getElementById('editId').value;
            const point = fullData.find(d => d.id === id);
            if (!point || !activeTenantId) return;

            const updatePayload = {
                nome: document.getElementById('editNome').value.trim(),
                indirizzo: document.getElementById('editIndirizzo').value.trim(),
                cap: document.getElementById('editCap').value.trim(),
                citta: document.getElementById('editCitta').value.trim(),
                provincia: document.getElementById('editProvincia').value.trim(),
                codice_zona: document.getElementById('editZona').value.trim(),
                finestre_consegna: document.getElementById('editFinestre').value.trim(),
                attivo: document.getElementById('editStato').value === "true"
            };

            if (GEOLOCATION_WRITE_READY) {
                updatePayload.geolocalizzazione = {
                    lat: document.getElementById('editLat').value.trim(),
                    lng: document.getElementById('editLng').value.trim()
                };
            }

            const docRef = doc(db, CompanyContext.getDeliveryPointsPath(activeTenantId), id);

            try {
                // UPDATE IN FIRESTORE
                await updateDoc(docRef, updatePayload);

                // UPDATE IN MEMORY
                Object.assign(point, updatePayload);

                closeEditModal();
                renderList();
                alert("Punto aggiornato con successo.");
            } catch(e) {
                console.error("Errore salvataggio:", e);
                alert("Errore durante il salvataggio: " + e.message);
            }
        }

        // ==========================================
        // RENDER LOGIC
        // ==========================================
        function renderList() {
            const search = document.getElementById("searchInput").value.toLowerCase().trim();
            const typeF = document.getElementById("typeFilter").value;
            const statusF = document.getElementById("statusFilter").value;

            let filtered = fullData;

            // Applica il resolver per filtrare e mostrare
            filtered.forEach(d => { d._resolvedType = resolvePointType(d); });

            if (search) {
                filtered = filtered.filter(d =>
                    (d.nome && d.nome.toLowerCase().includes(search)) ||
                    (d.indirizzo && d.indirizzo.toLowerCase().includes(search)) ||
                    (d.citta && d.citta.toLowerCase().includes(search)) ||
                    (d.codice_esterno && String(d.codice_esterno).toLowerCase().includes(search)) ||
                    (d.sottocodice && String(d.sottocodice).toLowerCase().includes(search)) ||
                    (d.codice_punto && String(d.codice_punto).toLowerCase().includes(search)) ||
                    (d.codice_zona && String(d.codice_zona).toLowerCase().includes(search)) ||
                    (d.association_group_id && String(d.association_group_id).toLowerCase().includes(search))
                );
            }

            if (typeF !== "ALL") {
                filtered = filtered.filter(d => d._resolvedType === typeF);
            }

            if (statusF === "ATTIVI") {
                filtered = filtered.filter(d => d.attivo !== false);
            } else if (statusF === "INATTIVI") {
                filtered = filtered.filter(d => d.attivo === false);
            }

            const fruttaCount = fullData.filter(d => d._resolvedType === "FRUTTA").length;
            const latteCount = fullData.filter(d => d._resolvedType === "LATTE").length;
            const unknownCount = fullData.length - (fruttaCount + latteCount);

            document.getElementById("stats").innerText =
                `Trovati ${filtered.length} su ${fullData.length} (FRUTTA: ${fruttaCount}, LATTE: ${latteCount}, UNKNOWN: ${unknownCount})`;

            const container = document.getElementById("listContainer");
            if (filtered.length === 0) {
                container.innerHTML = "<div class=\"empty-state\" style=\"grid-column: 1 / -1;\">Nessun punto di consegna presente o corrispondente ai filtri.</div>";
                container.classList.remove("cards-container");
                return;
            } else {
                container.classList.add("cards-container");
            }

            container.innerHTML = filtered.map(d => {
                const isActive = d.attivo !== false;
                const isLatte = d._resolvedType === "LATTE";
                const typeBadge = isLatte ? "<span class=\"badge latte\">LATTE</span>" : "<span class=\"badge frutta\">FRUTTA</span>";
                const codeDisplay = d.sottocodice ? (d.codice_esterno || "N/D") + " / " + d.sottocodice : (d.codice_esterno || d.codice_punto || "N/D");

                // ASSOCIATION LOGIC
                let assocHTML = "";
                if (d.association_group_id && associationMap[d.association_group_id]) {
                    const related = associationMap[d.association_group_id].filter(r => r.id !== d.id);
                    if (related.length > 0) {
                        assocHTML = "<div class=\"association-group\">" +
                            "<div style=\"display:flex; align-items:center; gap:4px;\">" +
                            "<span class=\"material-icons-round\" style=\"font-size:14px;\">link</span> <strong>ASSOCIATO A:</strong></div>" +
                            related.map(r => {
                                const rType = resolvePointType(r);
                                const rLatte = rType === "LATTE";
                                const rBadge = rLatte ? "<span style=\"color:#3b82f6; font-weight:bold;\">LATTE</span>" : "<span style=\"color:#f59e0b; font-weight:bold;\">FRUTTA</span>";
                                const rCode = r.sottocodice ? (r.codice_esterno || "N/D") + "/" + r.sottocodice : (r.codice_esterno || r.codice_punto || "N/D");
                                return "<div>" + rBadge + " - " + (r.nome || "Senza nome") + " (" + rCode + ")</div>";
                            }).join("") +
                        "</div>";
                    }
                }

                const windows = d.finestre_consegna ? (Array.isArray(d.finestre_consegna) ? d.finestre_consegna.join(", ") : d.finestre_consegna) : "-";
                const lat = d.geolocalizzazione && d.geolocalizzazione.lat ? parseFloat(d.geolocalizzazione.lat).toFixed(5) : "-";
                const lng = d.geolocalizzazione && d.geolocalizzazione.lng ? parseFloat(d.geolocalizzazione.lng).toFixed(5) : "-";
                const gpsStatusColor = (lat !== "-" && lng !== "-") ? "#10b981" : "#ef4444";

                return "<div class=\"item-card " + (isActive ? "" : "inactive") + "\">" +
                        "<div class=\"card-header\">" +
                            "<div>" +
                                "<h4 class=\"card-title\">" + (d.nome || "Senza Nome") + "</h4>" +
                                "<div style=\"display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;\">" +
                                    typeBadge +
                                    "<span class=\"badge\" style=\"background:#f1f5f9; color:#64748b\">ZONA: " + (d.codice_zona || "N/D") + "</span>" +
                                    (isActive ? "<span class=\"badge\" style=\"background:#10b981;\">ATTIVO</span>" : "<span class=\"badge\" style=\"background:#ef4444;\">INATTIVO</span>") +
                                "</div>" +
                            "</div>" +
                        "</div>" +
                        "<div class=\"card-body\">" +
                            "<div class=\"card-row\">" +
                                "<div class=\"data-item\" style=\"flex:2\">" +
                                    "<span class=\"data-label\">Indirizzo</span>" +
                                    "<span class=\"data-value\">" + (d.indirizzo || "") + " " + (d.cap || "") + "</span>" +
                                "</div>" +
                                "<div class=\"data-item\" style=\"flex:1.5\">" +
                                    "<span class=\"data-label\">Città / Prov</span>" +
                                    "<span class=\"data-value\">" + (d.citta || "") + " " + (d.provincia ? "("+d.provincia+")" : "") + "</span>" +
                                "</div>" +
                            "</div>" +
                            "<div class=\"card-row\" style=\"background:#f8fafc; padding:10px; border-radius:10px;\">" +
                                "<div class=\"data-item\">" +
                                    "<span class=\"data-label\">Codice</span>" +
                                    "<span class=\"data-value\">" + codeDisplay + "</span>" +
                                "</div>" +
                                "<div class=\"data-item\" style=\"border-left:1px solid #e2e8f0; padding-left:16px;\">" +
                                    "<span class=\"data-label\">Finestre Consegna</span>" +
                                    "<span class=\"data-value\">" + windows + "</span>" +
                                "</div>" +
                                "<div class=\"data-item\" style=\"border-left:1px solid #e2e8f0; padding-left:16px;\">" +
                                    "<span class=\"data-label\">GPS</span>" +
                                    "<span class=\"data-value\" style=\"color:" + gpsStatusColor + "\">" + lat + " / " + lng + "</span>" +
                                "</div>" +
                            "</div>" +
                            assocHTML +
                        "</div>" +
                        "<div class=\"card-actions\">" +
                            "<button class=\"btn-icon btn-geolocate\" data-id=\"" + d.id + "\">" +
                                "<span class=\"material-icons-round\">map</span> Geolocalizza" +
                            "</button>" +
                            "<button class=\"btn-icon btn-edit\" data-id=\"" + d.id + "\">" +
                                "<span class=\"material-icons-round\">edit</span> Modifica" +
                            "</button>" +
                        "</div>" +
                    "</div>";
            }).join("");
        }

        async function init(user) {
            const tenantLabel = localStorage.getItem("activeTenant") || "DNR";
            activeTenantId = resolveTenantId(tenantLabel);
            const statsEl = document.getElementById("stats");

            document.getElementById("tenantDisplay").innerText = "Tenant: " + tenantLabel;

            if (!activeTenantId) {
                statsEl.innerText = "Errore: Tenant non riconosciuto.";
                statsEl.style.color = "#ef4444";
                return;
            }

            const path = CompanyContext.getDeliveryPointsPath(activeTenantId);

            try {
                const snapshot = await getDocs(collection(db, path));
                fullData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                buildAssociationMap(fullData);

                if (fullData.length === 0) {
                    document.getElementById("listContainer").innerHTML = "<div class=\"empty-state\">Nessun punto di consegna presente per questo tenant.</div>";
                    document.getElementById("listContainer").classList.remove("cards-container");
                    statsEl.innerText = "0 record";
                } else {
                    renderList();
                }
            } catch (err) {
                console.error("[Punti di Consegna] Errore lettura:", err);
                statsEl.innerText = "Errore di caricamento: " + err.message;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("searchInput").addEventListener("input", renderList);
            document.getElementById("typeFilter").addEventListener("change", renderList);
            document.getElementById("statusFilter").addEventListener("change", renderList);

            // Event Delegation for action buttons
            document.getElementById("listContainer").addEventListener("click", (e) => {
                const btnGeo = e.target.closest(".btn-geolocate");
                const btnEdit = e.target.closest(".btn-edit");

                if (btnGeo) {
                    const id = btnGeo.getAttribute("data-id");
                    if (id) window.openMapModal(id);
                } else if (btnEdit) {
                    const id = btnEdit.getAttribute("data-id");
                    if (id) window.openEditModal(id);
                }
            });
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                init(user);
            }
        });
    </script>
    <script src="script.js?v=6.436"></script>
</body>
